<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1200;">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="toast show toast-custom {{ toast.classname }} border-0 shadow mb-2"
      [class.toast-leaving]="toast.isLeaving"
      role="alert">
      
      <div class="toast-header border-bottom border-light bg-transparent text-reset py-2">
        <i class="bi {{ toast.icon }} me-2 fs-5"></i>
        <strong class="me-auto">{{ toast.title }}</strong>
        <button 
          type="button" 
          class="btn-close"
          [class.btn-close-white]="toast.type !== 'warning'"
          (click)="closeToast($event, toast.id)">
        </button>
      </div>

      <div class="toast-body py-2">
        {{ toast.message }}
      </div>
    </div>
  }
</div>
